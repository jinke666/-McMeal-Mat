[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmeal-mate"
version = "1.1.0"
description = "麦麦搭子 (McMeal-Mate) —— 基于麦当劳 MCP 与多约束优化的低摩擦 AI 点餐搭子"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "McMeal-Mate Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
mcmeal = "mcmeal.cli:run_cli"
