name: Package McMeal-Mate Skill

on:
  push:
    branches: ["main"]
    paths:
      - "SKILL.md"
      - ".github/workflows/package-skill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build standalone Skill ZIP
        run: |
          rm -rf dist/mcmeal-mate-skill
          mkdir -p dist/mcmeal-mate-skill
          cp SKILL.md dist/mcmeal-mate-skill/SKILL.md
          cat > dist/mcmeal-mate-skill/安装说明.md <<'EOF'
          # 麦麦搭子 Skill 安装说明

          1. 在 WorkBuddy 的 Skill 管理/导入界面选择本地文件或文件夹。
          2. 导入本目录中的 SKILL.md，并启用麦麦搭子。
          3. 先用“午饭，30 元以内，不辣，想吃鸡肉”测试低对话成本推荐。
          4. 如需实时门店、菜单、优惠和价格，请另外配置可用的麦当劳 MCP 连接器。

          注意：Skill 文件定义的是助手行为规则，不会自动提供 MCP 凭证、实时数据或真实下单/支付能力。WorkBuddy 不同版本的导入方式可能不同；如果不支持 ZIP 导入，请解压后导入 SKILL.md。
          EOF
          cd dist
          zip -r mcmeal-mate-skill.zip mcmeal-mate-skill
      - name: Publish ZIP to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/mcmeal-mate-skill.zip
          if git diff --cached --quiet; then
            echo "Skill ZIP is already up to date."
          else
            git commit -m "build: refresh downloadable McMeal-Mate Skill ZIP"
            git push origin HEAD:main
          fi
